syntax = "proto2";
package kudu.cdc;

option java_package = "org.apache.kudu.cdc";

import "kudu/common/common.proto";
import "kudu/common/wire_protocol.proto";
import "kudu/rpc/rpc_header.proto";
import "kudu/security/token.proto";

// ===========================================================================
// Error handling
// ===========================================================================

message CDCErrorPB {
  enum Code {
    UNKNOWN_ERROR = 1;

    // The requested stream_id does not exist.
    STREAM_NOT_FOUND = 2;

    // The requested tablet is not hosted on this server.
    TABLET_NOT_FOUND = 3;

    // This tablet server is not the leader for the requested tablet.
    // The consumer should discover the new leader and retry.
    TABLET_NOT_LEADER = 4;

    // The requested from_op_index is no longer available (WAL GC'd past it).
    // Consumer must reset to a new snapshot.
    WAL_EXPIRED = 5;

    // The tablet is not in RUNNING state.
    TABLET_NOT_RUNNING = 6;

    // A before-image (or snapshot) read could not be served because the MVCC
    // history it needs has already been garbage-collected (the CDC history
    // barrier was not in place in time). Consumer must reset to a new snapshot.
    HISTORY_EXPIRED = 7;

    // The stream has been idle beyond --cdc_stream_expiry_ms, so its retention
    // barriers have been (or are being) released and the WAL the consumer needs
    // may already be garbage-collected. Consumer must reset to a new snapshot.
    STREAM_EXPIRED = 8;

    // Not returned by current servers: an authorization failure is an RPC
    // error, ERROR_INVALID_AUTHORIZATION_TOKEN (get a new authz token and
    // retry) or FATAL_UNAUTHORIZED (the caller may not read the table).
    NOT_AUTHORIZED = 9;

    // The server is at its CDC heavy-scan concurrency or memory budget (see
    // --cdc_max_concurrent_scans and --cdc_scan_mem_limit_bytes) and shed this
    // request to protect user-facing traffic. Also returned when the outcome of
    // the next op to stream is not known yet: the op is committed but this
    // replica has not applied it and written its COMMIT entry. Transient: the
    // consumer should back off and retry the same request.
    SERVER_TOO_BUSY = 10;

    // The snapshot of the tablet cannot be continued at its snapshot
    // timestamp: the resume key is not a position the session served, the
    // master has no cursor of an unfinished snapshot to resume, the history at
    // the snapshot timestamp was garbage-collected, or an ALTER dropped,
    // renamed or retyped a column the snapshot reads. (A leader change alone
    // does not cause it: the new leader rebuilds the session from the master's
    // durable cursor at the same timestamp.) Continuing at a freshly chosen
    // timestamp would splice a table tail read at the new timestamp onto a head
    // read at the old one, yielding an inconsistent snapshot. A consumer that
    // sent a wrong key may take the same snapshot again from the beginning
    // (is_snapshot_start=true, no resume key); otherwise, as needs_resnapshot
    // says, it must take a new snapshot (also new_snapshot_generation=true)
    // and replace the rows it got from the tablet with it.
    SNAPSHOT_SESSION_LOST = 11;

    // A committed transaction cannot be emitted atomically: its WAL span
    // (first write .. FINALIZE_COMMIT) exceeds --cdc_max_transaction_span_bytes
    // or the CDC read memory budget, so it cannot be read into a single window,
    // or its records do not fit in one response (see RESPONSE_TOO_LARGE). The
    // stream cannot advance past this transaction. This is a hard,
    // non-retryable condition requiring operator intervention (the status names
    // the limit to raise) rather than a transient error; retrying the same
    // request will keep failing.
    TRANSACTION_TOO_LARGE = 12;

    // The consumer declared (via GetChangesRequestPB.schema_version) that it is
    // decoding against a schema version older than the version of the ops
    // after the requested position: an ALTER has landed that the consumer
    // never saw, so it would silently decode new columns as hex. The consumer
    // should re-issue the request with need_schema_info=true to fetch that
    // schema, then resume. Retryable (after refreshing the schema), not a
    // re-snapshot.
    SCHEMA_VERSION_MISMATCH = 13;

    // A WAL op at or after the requested position could not be decoded into
    // change records. The stream cannot advance past it: the records before it
    // are returned and the checkpoint stops right before it, and a request that
    // cannot make any progress fails with this code. The status names the op
    // index. Non-retryable: retrying hits the same op, so this requires
    // operator action.
    DECODE_FAILED = 14;

    // The records of the next op to stream (or, for TRANSACTION_TOO_LARGE, of
    // the next transaction) do not fit in one response, which is bounded by the
    // tablet server's --rpc_max_message_size. A single op is never split
    // across responses, so the stream cannot advance past it. Non-retryable:
    // requires operator action, such as raising --rpc_max_message_size on the
    // tablet servers and the consumer.
    RESPONSE_TOO_LARGE = 15;

    // The tablet is not a tablet of a table of the stream. Non-retryable.
    TABLET_NOT_IN_STREAM = 16;

    // The schema that the ops after the requested position were applied with
    // is no longer known to the tablet server: the tablet keeps the schemas it
    // had before an ALTER only for a bounded number of ALTERs whose ops are in
    // the WAL. The records cannot be decoded with the right schema, so the
    // consumer must reset to a new snapshot.
    SCHEMA_UNAVAILABLE = 17;

    // The tablet's range partition was dropped and the stream has read every
    // change of the tablet: the request is at or past the tablet's last op
    // (see GetChangesResponsePB.dropped_tablet). The leader master keeps a
    // dropped tablet only until each stream acknowledged the drop, or for at
    // most --cdc_dropped_tablet_retention_secs, so the consumer should apply
    // the drop, then checkpoint the last op index with
    // CheckpointRequestPB.drop_applied, and stop polling the tablet. Applying
    // the drop means removing the rows delivered from this tablet: a range
    // partition with the same bounds that is added again is a new tablet,
    // whose rows may be delivered before this tablet's TABLET_DROPPED. Not an
    // error, and not retryable: no further changes will come from the tablet.
    TABLET_DROPPED = 18;
  }

  // Optional so that a consumer can parse an error whose code it does not
  // know, which a newer server may send: such a consumer sees no 'code'
  // (has_code() is false) and should act on 'is_retryable' and
  // 'needs_resnapshot'. Every server sets it.
  optional Code code = 1;
  required AppStatusPB status = 2;

  // Machine-readable retry classification, set by the server for every CDC
  // error so a consumer can act correctly without re-implementing the per-code
  // taxonomy. The two are mutually exclusive:
  //   is_retryable     -- transient: re-issue the SAME request after a backoff
  //                       (resolving the new leader first where applicable).
  //                       True for TABLET_NOT_LEADER, TABLET_NOT_FOUND,
  //                       TABLET_NOT_RUNNING, SERVER_TOO_BUSY,
  //                       SCHEMA_VERSION_MISMATCH.
  //   needs_resnapshot -- the requested WAL/history position is gone: discard
  //                       progress and start a fresh snapshot. True for
  //                       WAL_EXPIRED, HISTORY_EXPIRED, STREAM_EXPIRED,
  //                       SNAPSHOT_SESSION_LOST, SCHEMA_UNAVAILABLE.
  // Both false means fatal/operator-action (UNKNOWN_ERROR, STREAM_NOT_FOUND,
  // TRANSACTION_TOO_LARGE, DECODE_FAILED, RESPONSE_TOO_LARGE,
  // TABLET_NOT_IN_STREAM): stop and page an operator. A timeout or shed load
  // on the server is SERVER_TOO_BUSY, not UNKNOWN_ERROR. Both are false for
  // TABLET_DROPPED too, which ends the tablet but is not a failure.
  optional bool is_retryable = 3;
  optional bool needs_resnapshot = 4;
}

// ===========================================================================
// Stream configuration
// ===========================================================================

// The configuration of a stream, as the tablet servers apply it. A copy of
// master.proto's CDCStreamConfigPB, which the master stores and returns: the
// two must keep the same fields and enum values (cdc_service-test checks it).
//
// A tablet server rejects a configuration with a field or an enum value it
// does not know, which only a newer master can return, with a non-retryable
// error, rather than serving the stream as if the option were not set. So a
// new option must not change what an older tablet server would stream unless
// the master creates streams that use it only once every tablet server
// supports it (see TabletServerFeatures). Likewise, the master rejects a
// CreateCDCStream whose configuration it does not know. A master does not
// check the stream rows it loads, though, and it acts on the record type and
// snapshot mode itself: a new option is used only once every master knows it,
// and the masters are not downgraded while a stream uses it.
message CDCStreamConfigPB {
  // What columns to include in change records.
  enum RecordType {
    // After-image only (changed columns for UPDATE; all columns for INSERT/DELETE).
    CHANGE = 0;
    // Full before-image and after-image for every row change. Requires the MVCC
    // history barrier (before-images are reconstructed from tablet UNDO history).
    FULL   = 1;
  }

  // Wire format for change records.
  enum RecordFormat {
    PROTO = 0;
    // Reserved: JSON = 1
  }

  // Whether and how a consumer bootstraps from the table's current contents
  // before following the WAL.
  enum SnapshotMode {
    // Emit a consistent snapshot of the table, then hand off to WAL streaming.
    INITIAL_AND_CONTINUE = 0;
    // No snapshot; start WAL streaming immediately (preserves pre-snapshot
    // behavior and is the default).
    NEVER                = 1;
    // Emit the snapshot only; do not stream the WAL afterwards.
    INITIAL_ONLY         = 2;
  }

  optional RecordType   record_type           = 1 [default = CHANGE];
  optional RecordFormat record_format         = 2 [default = PROTO];

  // Was a per-stream GetChanges response size that no server ever applied; see
  // GetChangesRequestPB.max_bytes.
  reserved 3;
  reserved "max_bytes_per_response";

  optional SnapshotMode snapshot_mode         = 4 [default = NEVER];
}

// ===========================================================================
// Change event records
// ===========================================================================

// The type of change captured from the WAL.
enum CDCOpTypePB {
  // Row-level DML
  INSERT  = 0;
  UPDATE  = 1;
  DELETE  = 2;
  UPSERT  = 3;

  // Schema change
  DDL     = 4;

  // Transaction boundaries (emitted for transactional writes)
  BEGIN   = 5;
  COMMIT  = 6;
  ABORT   = 7;

  // A row emitted during the initial consistent snapshot (server-driven
  // bootstrap). Carries the full row image at the snapshot timestamp.
  READ    = 8;
}

// A single column value within a change record.
message CDCColumnValuePB {
  // The tablet's id of the column, as in the schemas of DDL records.
  optional int32  column_id   = 1;
  optional string column_name = 2;

  // Serialized cell value in the canonical Kudu on-wire format.
  // Absent (and is_null=false) if the column was not set in this operation
  // (e.g. partial UPDATE).
  optional bytes  value       = 3;
  optional bool   is_null     = 4 [default = false];
}

// A single change record, corresponding to one row operation from the WAL.
// One CDCRecordPB is produced per row in a WriteRequestPB (a single client
// write may contain multiple rows).
message CDCRecordPB {
  // The type of operation.
  optional CDCOpTypePB op_type = 1;

  // The Raft log index of the op that contained this operation. Raft indexes
  // increase across terms, so an op index identifies the op within its
  // tablet. Row records of a transaction keep the index of their write op,
  // which is below the index of the transaction's BEGIN and COMMIT records
  // (the index of its FINALIZE_COMMIT op). Do not use it to tell which changes
  // a consumer applied: see GetChangesResponsePB.checkpoint_op_index.
  optional int64 op_index = 2;

  // The Raft term.
  optional int64 op_term = 3;

  // The hybrid logical clock timestamp assigned to this operation (microseconds
  // since epoch, hybrid logical time encoding).
  optional fixed64 timestamp = 4;

  // The version of the schema that the tablet applied this operation with. Use
  // it to look up the schema when decoding the column values of 'changes',
  // except for FULL streams, where 'image_schema_version' is the one to use.
  // For DDL records, the version before the change.
  optional uint32 schema_version = 5;

  // Transaction ID for transactional writes (absent for non-transactional).
  optional bytes txn_id = 6;

  // After-image column values.
  // CHANGE streams: INSERT = the complete row as inserted, including the
  // columns the tablet filled with their defaults; UPSERT = the columns the
  // operation set; UPDATE = only the columns that changed; DELETE = primary
  // key columns only.
  // FULL streams: INSERT/UPDATE = the complete row after the change; DELETE =
  // primary key columns only.
  // READ (snapshot): the complete row at the snapshot timestamp.
  // For BEGIN/COMMIT/ABORT: empty.
  repeated CDCColumnValuePB changes = 7;

  // For DDL records: the new schema after the alter.
  optional SchemaPB new_schema = 8;

  // For DDL records: the new schema version. Every tablet of the table emits
  // its own DDL record for an ALTER, so a sink that applies DDL to the whole
  // table should apply each new_schema_version once. An ALTER that only
  // renames the table or changes its extra configuration emits a DDL record
  // whose new_schema is the previous schema. Adding or dropping a range
  // partition emits no DDL record (a dropped partition ends its tablet with
  // CDCErrorPB::TABLET_DROPPED).
  optional uint32 new_schema_version = 9;

  // For transactional records, the commit timestamp of the transaction
  // (hybrid logical time). Set on the BEGIN/COMMIT markers and on every row
  // record belonging to a committed transaction. Absent for non-transactional
  // records (which are ordered by 'timestamp' instead).
  optional fixed64 commit_timestamp = 10;

  // Before-image column values (FULL streams only): the complete row state
  // immediately before this change. Populated for UPDATE and DELETE (and for
  // UPSERT that resolved to an update of an existing row). Empty for INSERT,
  // for UPSERT that created a new row, and for READ/BEGIN/COMMIT/ABORT.
  repeated CDCColumnValuePB old_changes = 11;

  // Set on a CHANGE-stream UPSERT record that comes from an UPSERT_IGNORE
  // operation setting at least one immutable column. If the row already
  // existed, the tablet applied the operation as an update that left the
  // immutable columns unchanged, so a sink applying this record to an existing
  // row must not overwrite them. Never set on FULL streams: they resolve an
  // UPSERT to an INSERT, or to an UPDATE carrying the row as stored.
  optional bool keep_immutable_columns_on_update = 12;

  // FULL streams, row records: the version of the schema whose columns
  // 'changes' and 'old_changes' carry. The images of an operation that needs a
  // before-image are read from the tablet as of now, so this can be newer
  // than 'schema_version': a column dropped since is missing, and a column
  // added since has its default value.
  optional uint32 image_schema_version = 13;

  // For DDL records: the name and the extra configuration of the table after
  // the alter. Absent in the records of ops written by servers that did not
  // record them.
  optional string new_table_name = 14;
  optional TableExtraConfigPB new_extra_config = 15;
}

// A tablet whose range partition was dropped (ALTER TABLE ... DROP RANGE
// PARTITION). See CDCErrorPB::TABLET_DROPPED.
message CDCDroppedTabletPB {
  // The tablet's partition, which bounds the rows that were dropped.
  optional PartitionPB partition = 1;
  // The partition in human-readable form, such as "100 <= VALUES < 200".
  optional string partition_description = 2;
  // The index of the tablet's last op. A stream checkpointed at or past it has
  // every change of the tablet; see CheckpointRequestPB.drop_applied.
  optional int64 last_op_index = 3;
}

// ===========================================================================
// GetChanges RPC
// ===========================================================================

message GetChangesRequestPB {
  // The CDC stream to read from.
  required bytes stream_id = 1;

  // The tablet to read from. The caller must contact the tablet leader.
  required bytes tablet_id = 2;

  // Exclusive lower bound: return records with op_index > from_op_index.
  // Use 0 to start from the beginning of the available WAL.
  optional int64 from_op_index = 3 [default = 0];

  // Maximum total serialized size of returned records. If not set, or not
  // positive, the tablet server's --cdc_max_bytes_per_response is used; a
  // larger value is lowered to it. The records of one op or transaction are
  // never split: the first of them are returned even if they exceed the limit,
  // as long as they fit in one RPC message (else RESPONSE_TOO_LARGE or
  // TRANSACTION_TOO_LARGE).
  optional int64 max_bytes = 4;

  // Snapshot protocol (server-driven consistent snapshot).
  // Set true on the first call to begin a snapshot: the server captures a
  // snapshot timestamp and the current committed op-index, then returns the
  // first page of READ records. If a snapshot of the tablet is already in
  // progress for this stream (started and not completed, by this consumer or
  // by an earlier one), the server scans it again from the start of the tablet
  // at its snapshot timestamp instead, see new_snapshot_generation. Rejected if
  // the stream's snapshot_mode is NEVER.
  optional bool is_snapshot_start = 5 [default = false];

  // Opaque resume key returned as snapshot_resume_key in the previous response.
  // Pass it back verbatim, even if it is empty, to fetch the next page of the
  // snapshot scan.
  optional bytes snapshot_resume_key = 6;

  // If set, the server prepends a synthetic DDL record carrying the schema
  // (new_schema/new_schema_version) that the ops after from_op_index were
  // applied with, before the WAL records, so a consumer attaching mid-stream
  // after an ALTER has a base schema. The synthetic record reuses
  // from_op_index, has schema_version equal to new_schema_version (unlike the
  // DDL record of an ALTER), and does not advance checkpoint_op_index. A
  // request from at or past the committed index (e.g. from INT64_MAX, to start
  // from now) gets the schema of the ops after the returned
  // checkpoint_op_index. If that schema is no longer known, the request fails
  // with SCHEMA_UNAVAILABLE.
  optional bool need_schema_info = 7 [default = false];

  // Signed authorization token proving the caller may read the table backing this
  // tablet (reuses the scan-token machinery: obtain it from the master's
  // GetTableSchema response). Required, with SELECT on all columns of the
  // table, when the tablet server runs with --tserver_enforce_access_control.
  // Otherwise ignored.
  optional security.SignedTokenPB authz_token = 8;

  // The schema version the consumer is currently decoding records against. If
  // set and older than the version of the ops after from_op_index, the server
  // returns SCHEMA_VERSION_MISMATCH (instead of records) so the consumer can
  // refresh its layout with need_schema_info=true rather than silently decoding
  // new columns as hex. Unset (the default) disables the check -- for backward
  // compatibility and for consumers that track schema in-band via DDL records.
  // Ignored when need_schema_info=true, since the schema is being sent in that
  // case.
  optional uint32 schema_version = 9;

  // Set by a consumer that does not checkpoint the stream, for example a CLI
  // that only looks at it. Its reads move no durable stream state: streaming
  // from or past the streaming start point of a snapshot does not complete the
  // snapshot (see GetChangesResponsePB.snapshot_done), and a snapshot request
  // is rejected, since snapshot progress is durable. Its reads still count as
  // stream activity.
  optional bool read_only = 10 [default = false];

  // Set with is_snapshot_start to take a new snapshot of the tablet even if an
  // earlier one is unfinished (the master holds its durable cursor). The new
  // snapshot is read at a new snapshot timestamp, and nothing tells the
  // consumer which of the rows the earlier snapshot delivered were deleted
  // meanwhile: the consumer must replace the rows it got from the tablet with
  // the new snapshot rather than merge the two. Without it, is_snapshot_start
  // takes an unfinished snapshot again from the start of the tablet at its
  // snapshot timestamp, or fails with SNAPSHOT_SESSION_LOST if the history at
  // that timestamp is gone, so that a consumer never gets a new snapshot
  // without asking for one. Ignored without is_snapshot_start.
  optional bool new_snapshot_generation = 11 [default = false];
}

message GetChangesResponsePB {
  optional CDCErrorPB error = 1;

  // The change records of the tablet, in the order the changes became
  // visible: an op's records at the op's index, and a transaction's records
  // (BEGIN, its rows, COMMIT) together at the index of its FINALIZE_COMMIT op.
  // Since the rows keep the op index of their write, op_index is not
  // ascending across the records of a response.
  repeated CDCRecordPB records = 2;

  // The tablet's WAL position after this response: pass it as from_op_index
  // in the next call, and as op_index to Checkpoint once the records are
  // applied. A consumer that resumes from it gets every change after this
  // response and none of its records, so it is the only position to dedup or
  // resume by. It is at or past the op index of every record of the
  // response, but not necessarily the op index of one: it is the last op read
  // even if that op produced no record, or, if the consumer is caught up, the
  // last committed op in the leader's WAL, so it can be greater than
  // from_op_index in a response without records. It stays below the first
  // write of every transaction that is still open or that the response does
  // not carry, so it can be lower than the last op read. With a snapshot page,
  // -1 until the snapshot is done, then snapshot_streaming_start_op_index.
  // Not meaningful with an error.
  optional int64 checkpoint_op_index = 3 [default = -1];

  // Tablet UUID (echoed for routing convenience).
  optional bytes tablet_id = 4;

  // Snapshot protocol (server-driven consistent snapshot).
  // True once the full snapshot scan has completed; the consumer should then
  // begin WAL streaming from snapshot_streaming_start_op_index. The snapshot
  // stays in progress until the consumer streams or checkpoints from that
  // index on: until then the last page is served again for the same request,
  // and a consumer that restarts takes the snapshot again.
  optional bool snapshot_done = 5 [default = false];

  // The committed op-index captured when the snapshot began. Use it as
  // from_op_index for the first WAL-streaming GetChanges call after the
  // snapshot completes. Set only when snapshot_done is true.
  optional int64 snapshot_streaming_start_op_index = 6;

  // Opaque resume key: pass it as snapshot_resume_key in the next GetChanges
  // call to continue the snapshot scan. Set only while the snapshot is still
  // in progress (snapshot_done false). It can be empty (the first row of a
  // table whose primary key is a single STRING or BINARY column has the empty
  // key): test whether it is set, not whether it is empty.
  optional bytes snapshot_resume_key = 7;

  // True when this WAL-streaming batch was cut short by the per-response byte
  // budget before reaching the tablet's committed watermark -- i.e. more
  // records are immediately available. A consumer should keep polling right
  // away (from checkpoint_op_index) rather than backing off. False means the
  // batch reached the committed head: the consumer is caught up and should poll
  // on its normal interval. Not set on the snapshot path (use snapshot_done).
  optional bool have_more_records = 8 [default = false];

  // Set with the TABLET_DROPPED error: the dropped tablet.
  optional CDCDroppedTabletPB dropped_tablet = 9;
}

// ===========================================================================
// Checkpoint RPC
// ===========================================================================

// Records the consumer's progress for a specific (stream, tablet). The tablet
// server forwards it to the master asynchronously; the master's next
// retention pass lets the tablet's replicas garbage-collect the WAL before
// the lowest checkpoint of all streams of the tablet. A crash before the
// master persisted the checkpoint makes the consumer replay from the previous
// one (at-least-once). Consumers should call this periodically (not on every
// batch) to bound the load on the master.
message CheckpointRequestPB {
  required bytes stream_id = 1;
  required bytes tablet_id = 2;

  // The op_index up to which the consumer has successfully processed and
  // committed all records. This index is inclusive. It must be between 0 and
  // the last op index of the tablet's WAL.
  required int64 op_index = 3;

  // Signed authorization token (see GetChangesRequestPB.authz_token). Required
  // under --tserver_enforce_access_control.
  optional security.SignedTokenPB authz_token = 4;

  // Physical timestamp (microseconds since the Unix epoch, HybridClock physical
  // component) of the last operation the consumer has fully APPLIED (not merely
  // consumed). Populated by the reference consumer after each successful
  // DecodeAndDeliver batch; older consumers that never set this field leave the
  // server-side value at 0, which the server treats as "never reported" and
  // reports -1 for the committed-lag gauge rather than a spurious 0 lag.
  // Optional and backward-compatible: servers that do not yet understand this
  // field ignore it; consumers that do not set it receive cdc_stream_committed_lag_micros=-1.
  optional int64 last_applied_phystime_micros = 5;

  // Set by a consumer that applied the drop of the tablet's range partition
  // (see CDCErrorPB::TABLET_DROPPED), with 'op_index' at the tablet's last op
  // index (CDCDroppedTabletPB.last_op_index). Only such a checkpoint tells the
  // master that the stream is done with the tablet, so that it may delete it:
  // a consumer that stops before it applied the drop gets TABLET_DROPPED
  // again. Ignored for a tablet whose partition was not dropped, or if ops
  // that change rows follow 'op_index'.
  optional bool drop_applied = 6;
}

message CheckpointResponsePB {
  optional CDCErrorPB error = 1;
}

// ===========================================================================
// CDCService: hosted on each tablet server
// ===========================================================================

service CDCService {
  // CDC exposes raw WAL contents, so every RPC requires the caller to be an
  // authenticated client, service, or super user. (On an unsecured cluster
  // authorization is a no-op, as elsewhere in Kudu.) When the tablet server runs
  // with --tserver_enforce_access_control, GetChanges/Checkpoint additionally
  // require a signed authz_token granting SELECT on all columns of the target
  // table, which a failed RPC reports as ERROR_INVALID_AUTHORIZATION_TOKEN (the
  // token is missing, invalid or expired) or FATAL_UNAUTHORIZED.
  option (kudu.rpc.default_authz_method) = "AuthorizeClientOrServiceUser";

  // Returns a batch of change records for the given tablet, starting after
  // from_op_index. The caller must be connected to the tablet leader.
  rpc GetChanges(GetChangesRequestPB) returns (GetChangesResponsePB);

  // Records the consumer's checkpoint for a (stream, tablet) pair. Must be
  // sent to the tablet leader.
  rpc Checkpoint(CheckpointRequestPB) returns (CheckpointResponsePB);
}
